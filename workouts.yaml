            reps: 15
      - minute: 3
        exercises:
          - movement: "Goblet Squats"
            reps: 12
      - minute: 4
        exercises:
          - movement: "DB Rows"
            reps: 10
            note: "each arm"
      - minute: 5
        exercises:
          - movement: "Box Jumps"
            reps: 8
      - minute: 6
        exercises:
          - movement: "Plank"
            reps: 45
            note: "seconds"
    notes: "Rest for remaining time each minute. Repeat 6-min cycle × 3 = 18 minutes."

  - name: "Shoulders & Arms"
    subtitle: "5-Min EMOM × 4 Rounds"
    category: "EMOM"
    episode: 7
