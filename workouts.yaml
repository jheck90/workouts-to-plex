# workouts-to-plex config
# Each entry generates one workout card → PNG → 60-min looping MP4 in Plex.
#
# category:      becomes the Plex "show" subdirectory
# episode:       Plex episode number (increment when adding new workouts)
# timer_seconds: length of each EMOM cycle (60 for standard EMOM)
# total_minutes: total video length (default 60)
# heavy:         Minute 1 of the cycle — rendered with strength styling

settings:
  width: 1920
  height: 1080

workouts:

  - name: "Push Day"
    subtitle: "5-Min EMOM × 4 Rounds"
    category: "EMOM"
    episode: 1
    timer_seconds: 60
    total_minutes: 60
    warmup:
      - "10x Arm circles (each direction)"
      - "10x Band pull-aparts"
      - "10x Wall slides"
      - "10x Light push-ups"
    heavy:
      movement: "Bench Press"
      sets: 1
      reps: "3"
      note: "@ 80–85% 1RM"
    rounds:
      - minute: 2
        exercises:
          - movement: "Push-Ups"
            reps: 12
      - minute: 3
        exercises:
          - movement: "DB Shoulder Press"
            reps: 10
      - minute: 4
        exercises:
          - movement: "Tricep Dips"
            reps: 12
      - minute: 5
        exercises:
          - movement: "Lateral Raises"
            reps: 10
    notes: "Rest for remaining time each minute. Repeat 5-min cycle × 4 = 20 minutes."

  - name: "Pull Day"
    subtitle: "9-Min EMOM × Rounds"
    category: "EMOM"
    episode: 2
    timer_seconds: 60
    total_minutes: 63
    warmup:
      - "10x Band pull-aparts"
      - "10x Face pulls (light)"
      - "30s Dead hang"
      - "5x Scapular pull-ups"
    heavy:
      movement: "Barbell Row"
      sets: 1
      reps: "5"
      note: "@ 80–85% 1RM"
    rounds:
      - minute: 2
        exercises:
          - movement: "Jump Rope"
            reps: 50
            note: "doubles or 100 singles"
      - minute: 3
        exercises:
          - movement: "Pull Ups"
            reps: 8
      - minute: 4
        exercises:
          - movement: "Single Arm Row"
            reps: 10
            note: "each arm"
      - minute: 5
        exercises:
          - movement: "Jump Rope"
            reps: 50
            note: "doubles or 100 singles"
      - minute: 6
        exercises:
          - movement: "Chin Ups"
            reps: 8
      - minute: 7
        exercises:
          - movement: "DB Rear Flyes"
            reps: 12
      - minute: 8
        exercises:
          - movement: "Face Pulls"
            reps: 15
    notes: "Rounds 1–4 → Barbell Row → Rounds 5–7. Rest remaining time each minute."

  - name: "Leg Day"
    subtitle: "5-Min EMOM × 4 Rounds"
    category: "EMOM"
    episode: 3
    timer_seconds: 60
    total_minutes: 60
    warmup:
      - "10x Hip circles (each direction)"
      - "10x Leg swings (each leg)"
      - "10x Bodyweight squats"
      - "10x Walking lunges"
    heavy:
      movement: "Back Squat"
      sets: 1
      reps: "3"
      note: "@ 80–85% 1RM"
    rounds:
      - minute: 2
        exercises:
          - movement: "Goblet Squats"
            reps: 10
      - minute: 3
        exercises:
          - movement: "Reverse Lunges"
            reps: 12
            note: "each leg"
      - minute: 4
        exercises:
          - movement: "Glute Bridges"
            reps: 15
      - minute: 5
        exercises:
          - movement: "Box Jumps"
            reps: 10
    notes: "Rest for remaining time each minute. Repeat 5-min cycle × 4 = 20 minutes."

  - name: "Core & Conditioning"
    subtitle: "5-Min EMOM × 4 Rounds"
    category: "EMOM"
    episode: 4
    timer_seconds: 60
    total_minutes: 60
    warmup:
      - "30s Dead bug holds"
      - "10x Cat-cow stretches"
      - "10x Hip flexor pulses (each side)"
      - "20s Plank hold"
    heavy:
      movement: "Hanging Leg Raises"
      sets: 1
      reps: "10"
      note: "Controlled tempo, full range"
    rounds:
      - minute: 2
        exercises:
          - movement: "Ab Wheel Rollouts"
            reps: 10
      - minute: 3
        exercises:
          - movement: "Russian Twists"
            reps: 20
            note: "each side, weighted"
      - minute: 4
        exercises:
          - movement: "Hollow Body Hold"
            reps: 30
            note: "seconds"
      - minute: 5
        exercises:
          - movement: "Mountain Climbers"
            reps: 20
            note: "each leg"
    notes: "Rest for remaining time each minute. Repeat 5-min cycle × 4 = 20 minutes."

  - name: "Upper Body Strength"
    subtitle: "5×5 Strength Block"
    category: "Strength"
    episode: 5
    timer_seconds: 300
    total_minutes: 60
    warmup:
      - "5 min easy cardio"
      - "2×10 empty-bar bench press"
      - "2×10 empty-bar overhead press"
      - "10x Band pull-aparts"
    heavy:
      movement: "Bench Press"
      sets: 5
      reps: "5"
      note: "@ 80–85% 1RM — 3 min rest"
    rounds:
      - minute: 2
        exercises:
          - movement: "Barbell Row"
            reps: 5
            note: "@ 75–80% 1RM — 3 min rest"
      - minute: 3
        exercises:
          - movement: "Overhead Press"
            reps: 5
            note: "@ 75–80% 1RM — 3 min rest"
      - minute: 4
        exercises:
          - movement: "Weighted Pull-Ups"
            reps: 5
            note: "add weight if bodyweight is easy"
      - minute: 5
        exercises:
          - movement: "DB Incline Press"
            reps: 8
            note: "3×8 @ moderate weight"
    notes: "Focus on heavy compound lifts. Full rest between sets. Log weights each session."

